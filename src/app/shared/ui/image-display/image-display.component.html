<div>
    @if (isLoading()) {
      <div>Loading...</div>
    } @else if (isError()) {
      <div>Error: {{ errorMsgWithDefaultValue() }}</div>
    } @else {
      @if (image(); as img) {
        <img src="{{ img }}" alt="Generated Image" />
      } @else {
        <div>No image generated yet.</div>
      }
    }
</div>
