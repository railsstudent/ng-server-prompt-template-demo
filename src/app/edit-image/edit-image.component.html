<div class="edit-image-card">
  <h2 class="edit-image-title">{{ pageTitle() }}</h2>
  <p>templateKey: {{ templateKey() }}</p>
  <div class="w-full max-w-xl mx-auto">
    <app-file-uploader (fileChanged)="onFileChanged($event)" />
    <button (click)="generateImage($event)">Generate</button>
  </div>
</div>
