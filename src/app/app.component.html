<div class="flex h-screen w-screen overflow-hidden bg-white text-gray-800">
  <!-- SideNav on the left -->
  <app-side-nav class="w-64 flex-shrink-0"></app-side-nav>

  <!-- Main content area on the right -->
  <div class="flex flex-col flex-1 overflow-hidden">
    <!-- Header on top of main content -->
    <app-header class="flex-shrink-0"
      [breadcrumb]="breadcrumb()"
      [status]="status()"
      [templateId]="templateId()"
    ></app-header>

    <!-- Router outlet (Home/Main Content) -->
    <main class="flex-1 overflow-auto p-4">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer at the bottom of main content -->
    <app-footer class="flex-shrink-0"></app-footer>
  </div>
</div>
