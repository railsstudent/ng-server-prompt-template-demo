<header>
  <h1 class="text-4xl font-bold underline">Intelligent Task Hub</h1>
</header>
@if (isLoading()) {
  <div>Loading...</div>
} @else if (isError()) {
  <div>Error: {{ errorMsg() }}</div>
} @else {
  @if (inlineImageData()) {
    <img [src]="inlineImageData()" alt="Embedded Image" />
  }
  <button type="button" (click)="generateImage()">Generate an image</button>
  <router-outlet />
}
<footer class="bg-gray-800 mt-auto">
  <div class="container mx-auto px-6 py-4 text-center text-gray-400">
    <p>&copy; 2026 Intelligent Task Hub. Built with Angular, Gemini, Firebase, Firebase AI Logic & Tailwind.</p>
  </div>
</footer>
